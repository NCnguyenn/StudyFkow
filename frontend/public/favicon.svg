<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
  </defs>
  <!-- Background Box with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <!-- Glowing circle behind the icon -->
  <circle cx="256" cy="256" r="160" fill="url(#glowGrad)" opacity="0.15" filter="blur(20px)" />
  
  <!-- Academic book icon with glowing pages -->
  <g transform="translate(128, 128)">
    <!-- Left Page -->
    <path d="M128 40 C60 40 20 60 0 80 L0 220 C20 200 60 180 128 180 Z" fill="url(#glowGrad)" />
    <!-- Right Page -->
    <path d="M128 40 C196 40 236 60 256 80 L256 220 C236 200 196 180 128 180 Z" fill="url(#glowGrad)" opacity="0.9" />
    <!-- Book Spine center line -->
    <line x1="128" y1="40" x2="128" y2="240" stroke="#0b0f19" stroke-width="4" />
    <!-- Glowing Star/Idea element -->
    <path d="M128 -20 L134 -4 L150 -4 L138 6 L142 22 L128 12 L114 22 L118 6 L106 -4 L122 -4 Z" fill="url(#accentGrad)" />
  </g>
</svg>
